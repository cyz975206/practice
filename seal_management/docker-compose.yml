# 印章管理系统 · 本地开发中间件一键栈（部署到开发虚拟机 192.168.1.128）
# 仅 dev 用；生产走 K8s/独立部署（见 docs/backend-architecture.md §16）。
# 版本与 §2 钉死值对齐。启动：scp 本文件到 VM 后 `docker compose up -d`。
#
# 后端（Windows 开发机）连接信息：
#   PostgreSQL  192.168.1.128:5432   db=seal  user=seal  pwd=seal123
#   Redis       192.168.1.128:6380   pwd=seal123            （宿主 6379 被现有 redis 占用，seal 用 6380）
#   RabbitMQ    192.168.1.128:5672   user=seal  pwd=seal123 （管理台 :15672 / STOMP :61613）
#   Elasticsearch http://192.168.1.128:9200
#   MinIO       192.168.1.128:9000 (S3 API) / :9001 (控制台)  user=seal  pwd=seal12345
services:
  postgres:
    image: postgres:16
    container_name: seal-postgres
    environment:
      POSTGRES_DB: seal
      POSTGRES_USER: seal
      POSTGRES_PASSWORD: seal123
    ports: [ "5432:5432" ]
    volumes: [ "seal-pg:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U seal -d seal" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [ seal-net ]

  redis:
    image: redis:7-alpine
    container_name: seal-redis
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "seal123" ]
    ports: [ "6380:6379" ]
    volumes: [ "seal-redis:/data" ]
    networks: [ seal-net ]

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: seal-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: seal
      RABBITMQ_DEFAULT_PASS: seal123
    # 启用 STOMP 插件（WS STOMP relay 需要，ADR-0009）
    command: [ "sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server" ]
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # 管理控制台
      - "61613:61613"   # STOMP
    volumes: [ "seal-rabbitmq:/var/lib/rabbitmq" ]
    networks: [ seal-net ]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: seal-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.security.enrollment.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: [ "9200:9200" ]
    volumes: [ "seal-es:/usr/share/elasticsearch/data" ]
    networks: [ seal-net ]

  minio:
    image: minio/minio
    container_name: seal-minio
    command: [ "server", "/data", "--console-address", ":9001" ]
    environment:
      MINIO_ROOT_USER: seal
      MINIO_ROOT_PASSWORD: seal12345
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes: [ "seal-minio:/data" ]
    networks: [ seal-net ]

networks:
  seal-net:
    name: seal-net

volumes:
  seal-pg:
  seal-redis:
  seal-rabbitmq:
  seal-es:
  seal-minio:
