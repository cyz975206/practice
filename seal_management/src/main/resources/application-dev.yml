# 开发环境：连开发虚拟机 192.168.1.128 的中间件栈（docker-compose.yml 起的）。
# 生产用 application-prod.yml 覆盖。
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://192.168.1.128:5432/seal
    username: seal
    password: seal123
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: 192.168.1.128
      port: 6380           # 宿主 6379 被现有 redis 占用，seal 用 6380
      password: seal123
      timeout: 3000ms
  flyway:
    enabled: true
    baseline-on-migrate: true     # DB 已有 Flowable ACT_* 表，首次引入 Flyway 时先 baseline
    baseline-version: "0"         # baseline 在 0，保证 V1 仍被执行
  # Redisson 读 spring.data.redis 配置，提供分布式锁（集群级，ADR-0009），不再排除

# Flowable：在 PG 上自动建表（首次启动建 ACT_*）；当前关闭 async executor（分布式部署时再开，ADR-0009）
flowable:
  database-schema-update: true
  async-executor-activate: false
  history-level: audit

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler

logging:
  level:
    com.cyz.seal: debug

seal:
  jwt:
    secret: "seal-management-dev-jwt-secret-change-in-production-0123456789"  # ≥32 字节；生产务必覆盖
    expiry: 8h
  bootstrap:
    admin-password: "888888"   # 首次初始化建的 admin 用户密码

