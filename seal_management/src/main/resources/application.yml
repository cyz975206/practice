server:
  port: 8080

spring:
  application:
    name: seal-management
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 多租户（ADR-0002）、Flowable（ADR-0003）、Redis、存储等配置在各 profile 中覆盖。
# Knife4j / OpenAPI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
knife4j:
  enable: true
  setting:
    language: zh_cn
