<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>灯下 · 登录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MorphSVGPlugin.min.js"
            onload="window.__morphSVG=true"
            onerror="console.log('MorphSVGPlugin unavailable')"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --shade-hue: 45;
            --on: 0;
            --bg: #121921;
            --text: #cdd1dc;
            --text-dim: #546070;
            --card-bg: rgba(16, 22, 34, 0.92);
            --input-bg: rgba(10, 16, 26, 0.85);
            --input-border: rgba(80, 95, 120, 0.25);
        }

        html, body { height: 100%; }

        body {
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient glow overlay */
        #ambientOverlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        /* Vignette */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%);
            pointer-events: none;
            z-index: 0;
        }

        /* Grain texture */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.028;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 0;
        }

        /* ── Layout ── */
        .scene {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 70px;
            padding: 40px 24px;
            flex-wrap: wrap;
            z-index: 1;
            position: relative;
        }

        /* ── Lamp ── */
        .lamp-section {
            position: relative;
            width: 280px;
            flex-shrink: 0;
        }

        #lamp {
            width: 100%;
            height: auto;
            overflow: visible;
            filter: drop-shadow(0 8px 24px rgba(0,0,0,0.35));
        }

        .lamp-hint {
            text-align: center;
            margin-top: 16px;
            font-size: 12.5px;
            font-weight: 300;
            color: var(--text-dim);
            letter-spacing: 2px;
            opacity: 1;
            transition: opacity 0.5s;
        }
        .lamp-hint.hidden { opacity: 0; }

        #cordGroup { cursor: grab; }
        #cordGroup:active { cursor: grabbing; }

        /* ── Form ── */
        .form-section { position: relative; }

        #loginForm {
            opacity: 0;
            transform: scale(0.82);
            width: 380px;
            padding: 44px 40px 36px;
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.04);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            pointer-events: none;
            position: relative;
        }

        #loginForm.lit {
            pointer-events: auto;
            border-color: hsla(var(--shade-hue), 70%, 50%, 0.25);
            box-shadow:
                0 0 30px hsla(var(--shade-hue), 80%, 55%, 0.1),
                0 0 80px hsla(var(--shade-hue), 65%, 45%, 0.06),
                inset 0 1px 0 rgba(255,255,255,0.04);
        }

        #loginForm h2 {
            font-family: 'Cormorant Garamond', 'PingFang SC', 'Microsoft YaHei', serif;
            font-size: 30px;
            font-weight: 300;
            letter-spacing: 6px;
            margin-bottom: 36px;
            color: #e4e8f2;
        }

        .field {
            margin-bottom: 22px;
            position: relative;
        }

        .field label {
            display: block;
            font-size: 12.5px;
            font-weight: 400;
            color: var(--text-dim);
            margin-bottom: 8px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }

        .field input {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1.5px solid var(--input-border);
            border-radius: 12px;
            color: var(--text);
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.35s, box-shadow 0.35s;
        }
        .field input::placeholder { color: rgba(90, 105, 130, 0.55); }

        .field input:focus {
            border-color: hsla(var(--shade-hue), 80%, 58%, 0.65);
            box-shadow:
                0 0 0 3px hsla(var(--shade-hue), 80%, 55%, 0.1),
                0 0 24px hsla(var(--shade-hue), 70%, 50%, 0.08);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: hsla(var(--shade-hue), 65%, 50%, 0.75);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            cursor: pointer;
            transition: background 0.35s, transform 0.15s, box-shadow 0.35s;
        }
        .login-btn:hover {
            background: hsla(var(--shade-hue), 70%, 58%, 0.9);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px hsla(var(--shade-hue), 65%, 48%, 0.25);
        }
        .login-btn:active { transform: translateY(0); }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 18px;
            font-size: 13px;
            color: hsla(var(--shade-hue), 55%, 58%, 0.6);
            text-decoration: none;
            transition: color 0.3s;
        }
        .forgot-link:hover { color: hsla(var(--shade-hue), 65%, 68%, 0.85); }

        /* ── Footer ── */
        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 18px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            color: rgba(84, 96, 112, 0.6);
            letter-spacing: 0.8px;
            z-index: 1;
        }

        /* ── Responsive ── */
        @media (max-width: 800px) {
            .scene { flex-direction: column; gap: 24px; }
            .lamp-section { width: 210px; }
            #loginForm { width: 92vw; max-width: 380px; padding: 32px 28px 28px; }
        }

        @media (max-width: 400px) {
            #loginForm { padding: 26px 20px 22px; }
        }
    </style>
</head>
<body>

<div id="ambientOverlay"></div>

<main class="scene">
    <!-- ── Lamp ── -->
    <div class="lamp-section">
        <svg id="lamp" viewBox="0 0 300 440" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
                    <stop id="gs1" offset="0%"   stop-color="#f0c040" stop-opacity="0.45"/>
                    <stop id="gs2" offset="100%"  stop-color="#f0c040" stop-opacity="0"/>
                </radialGradient>
                <linearGradient id="coneGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop id="cs1" offset="0%"   stop-color="#f0c040" stop-opacity="0.22"/>
                    <stop id="cs2" offset="100%" stop-color="#f0c040" stop-opacity="0"/>
                </linearGradient>
                <linearGradient id="metalG" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%"   stop-color="#383f50"/>
                    <stop offset="45%"  stop-color="#5a6278"/>
                    <stop offset="100%" stop-color="#383f50"/>
                </linearGradient>
                <linearGradient id="shadeG" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%"   stop-color="#555d75"/>
                    <stop offset="100%" stop-color="#3c4458"/>
                </linearGradient>
            </defs>

            <!-- Light effects (hidden initially) -->
            <circle id="lightGlow" cx="150" cy="208" r="140" fill="url(#glowGrad)" opacity="0"/>
            <path id="lightCone" d="M122,205 L48,410 L252,410 L178,205 Z" fill="url(#coneGrad)" opacity="0"/>

            <!-- Base -->
            <ellipse cx="150" cy="420" rx="56" ry="9" fill="#1e2230"/>
            <rect x="118" y="409" width="64" height="14" rx="5" fill="url(#metalG)"/>

            <!-- Base column -->
            <rect x="141" y="387" width="18" height="26" rx="3" fill="#3c4356"/>

            <!-- Lower arm -->
            <line x1="150" y1="392" x2="130" y2="298" stroke="#4a5068" stroke-width="9" stroke-linecap="round"/>

            <!-- Elbow joint -->
            <circle cx="130" cy="298" r="10" fill="#4a5068"/>
            <circle cx="130" cy="298" r="5"  fill="#5c6480"/>

            <!-- Upper arm -->
            <line x1="130" y1="298" x2="152" y2="198" stroke="#4a5068" stroke-width="9" stroke-linecap="round"/>

            <!-- Shade joint -->
            <circle cx="152" cy="198" r="7" fill="#4a5068"/>

            <!-- Shade body -->
            <path d="M93,205 L110,152 Q152,138 194,152 L211,205 Z" fill="url(#shadeG)" stroke="#5c6480" stroke-width="0.5"/>

            <!-- Shade rim -->
            <rect x="88" y="200" width="128" height="8" rx="4" fill="#5a6480"/>

            <!-- Eyes -->
            <g id="lampEyes">
                <ellipse cx="130" cy="180" rx="10" ry="12" fill="#dde1ec"/>
                <circle cx="130" cy="177" r="5.5" fill="#1a1d30"/>
                <circle cx="133" cy="174" r="1.7" fill="#fff" opacity="0.8"/>
                <ellipse cx="174" cy="180" rx="10" ry="12" fill="#dde1ec"/>
                <circle cx="174" cy="177" r="5.5" fill="#1a1d30"/>
                <circle cx="177" cy="174" r="1.7" fill="#fff" opacity="0.8"/>
            </g>

            <!-- Bulb -->
            <ellipse id="bulb" cx="152" cy="208" rx="8" ry="11" fill="#282e3e"/>

            <!-- Pull cord path (animated) -->
            <path id="cordPath" d="M192,205 Q192,261 192,318" stroke="#686e82" stroke-width="2.5" fill="none" stroke-linecap="round"/>

            <!-- Cord ball group (draggable) -->
            <g id="cordGroup">
                <circle cx="192" cy="318" r="10" fill="#848a9e" stroke="#686e82" stroke-width="2"/>
                <circle cx="190" cy="315" r="3.2" fill="#989eb2" opacity="0.4"/>
            </g>
        </svg>
        <p class="lamp-hint" id="lampHint">↓ 拖拽拉绳开灯</p>
    </div>

    <!-- ── Form ── -->
    <div class="form-section">
        <form id="loginForm" autocomplete="off">
            <h2>欢迎回来</h2>
            <div class="field">
                <label for="account">账号</label>
                <input type="text" id="account" placeholder="请输入账号" autocomplete="off"/>
            </div>
            <div class="field">
                <label for="password">密码</label>
                <input type="password" id="password" placeholder="请输入密码" autocomplete="off"/>
            </div>
            <button type="submit" class="login-btn">登 录</button>
            <a href="javascript:void(0)" class="forgot-link">忘记密码？</a>
        </form>
    </div>
</main>

<footer>
    <time id="footerDate"></time>
    <span>Design by Lamplight</span>
</footer>

<script>
(function () {
    'use strict';

    /* ── DOM ── */
    var lampEyes   = document.getElementById('lampEyes');
    var lightGlow  = document.getElementById('lightGlow');
    var lightCone  = document.getElementById('lightCone');
    var bulb       = document.getElementById('bulb');
    var cordPath   = document.getElementById('cordPath');
    var cordGroup  = document.getElementById('cordGroup');
    var loginForm  = document.getElementById('loginForm');
    var lampHint   = document.getElementById('lampHint');
    var ambient    = document.getElementById('ambientOverlay');
    var footerDate = document.getElementById('footerDate');

    /* ── Footer date ── */
    var d = new Date();
    footerDate.textContent = d.getFullYear() + '\u5E74' + (d.getMonth() + 1) + '\u6708' + d.getDate() + '\u65E5';

    /* ── State ── */
    var isOn       = false;
    var willToggle = false;
    var audioCtx;

    /* ── GSAP plugins ── */
    var hasMorphSVG = !!window.__morphSVG;
    if (hasMorphSVG) gsap.registerPlugin(MorphSVGPlugin);
    gsap.registerPlugin(Draggable);

    /* Eyes looking down (lamp off) */
    gsap.set(lampEyes, { svgOrigin: '152 180', rotation: 180 });

    /* ── Cord constants ── */
    var CORD_Y0 = 205;   // shade attachment point
    var CORD_Y1 = 318;   // rest position of ball center
    var CORD_X  = 192;

    /* MorphSVG wave shapes */
    var cordNormal = 'M192,205 Q192,261 192,318';
    var cordWaveA  = 'M192,205 Q216,232 170,268 Q216,294 192,318';
    var cordWaveB  = 'M192,205 Q168,232 214,268 Q168,294 192,318';

    /* ── Audio: mechanical click ── */
    function playClick() {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            var t   = audioCtx.currentTime;
            var osc = audioCtx.createOscillator();
            var g   = audioCtx.createGain();
            osc.connect(g);
            g.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(1400, t);
            osc.frequency.exponentialRampToValueAtTime(280, t + 0.04);
            g.gain.setValueAtTime(0.14, t);
            g.gain.exponentialRampToValueAtTime(0.001, t + 0.09);
            osc.start(t);
            osc.stop(t + 0.09);
        } catch (_) { /* silent */ }
    }

    /* ── Update CSS / SVG colors ── */
    function updateColors(hue) {
        document.documentElement.style.setProperty('--shade-hue', hue);
        var c = 'hsl(' + hue + ',80%,65%)';
        document.getElementById('gs1').setAttribute('stop-color', c);
        document.getElementById('gs2').setAttribute('stop-color', c);
        document.getElementById('cs1').setAttribute('stop-color', c);
        document.getElementById('cs2').setAttribute('stop-color', c);
    }

    /* ── Cord path helper ── */
    function setPath(ballY, wave) {
        wave = wave || 0;
        var midY = (CORD_Y0 + ballY) / 2;
        cordPath.setAttribute('d',
            'M' + CORD_X + ',' + CORD_Y0 +
            ' Q' + (CORD_X + wave) + ',' + midY +
            ' ' + CORD_X + ',' + ballY
        );
    }

    /* ── Toggle lamp on/off ── */
    function toggleLamp() {
        isOn = !isOn;
        var hue = isOn ? Math.floor(Math.random() * 360) : 45;
        updateColors(hue);
        document.documentElement.style.setProperty('--on', isOn ? '1' : '0');

        var bulbColor = isOn ? 'hsl(' + hue + ',80%,65%)' : '#282e3e';

        if (isOn) {
            ambient.style.background =
                'radial-gradient(ellipse at 35% 50%, hsla(' + hue + ',55%,22%,0.14) 0%, transparent 60%)';
            ambient.style.opacity = '1';
        } else {
            ambient.style.opacity = '0';
        }

        var tl = gsap.timeline();

        if (isOn) {
            tl.to(lightGlow, { opacity: 1, duration: 0.7, ease: 'power2.out' }, 0)
              .to(lightCone,  { opacity: 1, duration: 0.9, ease: 'power2.out' }, 0)
              .to(bulb,       { attr: { fill: bulbColor }, duration: 0.35 }, 0)
              .to(lampEyes,   { rotation: 0, duration: 0.55, ease: 'back.out(1.7)' }, 0)
              .to(loginForm,  { opacity: 1, scale: 1, duration: 0.75, ease: 'back.out(1.7)' }, 0.2)
              .to(lampHint,   { opacity: 0, duration: 0.3 }, 0);
            loginForm.classList.add('lit');
        } else {
            tl.to(loginForm,  { opacity: 0, scale: 0.82, duration: 0.35, ease: 'power2.in' }, 0)
              .to(lightGlow,  { opacity: 0, duration: 0.45 }, 0)
              .to(lightCone,  { opacity: 0, duration: 0.5 }, 0)
              .to(bulb,       { attr: { fill: bulbColor }, duration: 0.3 }, 0)
              .to(lampEyes,   { rotation: 180, duration: 0.55, ease: 'power2.inOut' }, 0.05)
              .to(lampHint,   { opacity: 1, duration: 0.35 }, 0.35);
            loginForm.classList.remove('lit');
        }
    }

    /* ── Bounce cord back after drag ── */
    function bounceCordBack() {
        dragRef[0].disable();

        /* Phase 1 — elastic return with manual wave */
        gsap.to(cordGroup, {
            y: 0,
            duration: 0.85,
            ease: 'elastic.out(1, 0.32)',
            onUpdate: function () {
                var offset  = gsap.getProperty(cordGroup, 'y');
                var visualY = CORD_Y1 + offset;
                var p = this.progress();
                var wave = Math.sin(p * Math.PI * 6) * (1 - p) * 20;
                setPath(visualY, wave);
            },
            onComplete: function () {
                setPath(CORD_Y1, 0);

                /* Phase 2 — MorphSVG wave flourish (if available) */
                if (hasMorphSVG) {
                    gsap.timeline({
                        onComplete: function () {
                            gsap.set(cordPath, { attr: { d: cordNormal } });
                            dragRef[0].enable();
                        }
                    })
                    .to(cordPath, { morphSVG: cordWaveA, duration: 0.09 })
                    .to(cordPath, { morphSVG: cordWaveB, duration: 0.09 })
                    .to(cordPath, { morphSVG: cordWaveA, duration: 0.07 })
                    .to(cordPath, { morphSVG: cordNormal, duration: 0.2, ease: 'power2.out' });
                } else {
                    dragRef[0].enable();
                }
            }
        });
    }

    /* ── Draggable ── */
    var dragRef = Draggable.create(cordGroup, {
        type: 'y',
        bounds: { minY: 0, maxY: 120 },
        onDragStart: function () { willToggle = false; },
        onDrag: function () {
            var offset = this.y || 0;
            setPath(CORD_Y1 + offset, 0);
            if (offset > 50) willToggle = true;
        },
        onDragEnd: function () {
            playClick();
            if (willToggle) toggleLamp();
            bounceCordBack();
        }
    });

    /* ── Init ── */
    updateColors(45);
    loginForm.addEventListener('submit', function (e) { e.preventDefault(); });

})();
</script>
</body>
</html>
